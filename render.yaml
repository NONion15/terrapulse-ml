services:
  - type: web
    name: terrapulse-ml
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers=1 --threads=4 --timeout=120 --bind=0.0.0.0:$PORT app.server:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: WEB_CONCURRENCY
        value: 1
    plan: free
